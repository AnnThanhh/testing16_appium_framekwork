plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
//    testImplementation platform('org.junit:junit-bom:5.10.0')
//    testImplementation 'org.junit.jupiter:junit-jupiter'
//    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.seleniumhq.selenium:selenium-java:4.33.0'
    implementation 'io.appium:java-client:9.4.0'

    implementation 'org.testng:testng:7.12.0'

    implementation 'com.aventstack:extentreports:5.1.2'

    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.0'
}

test {
    useTestNG() {
        useDefaultListeners = true //dùng để tạo report testNG
        outputDirectory = file("$projectDir/test_output") // folder chứa testNG report
    }
}